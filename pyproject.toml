[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "demorec"
version = "0.1.0"
description = "Scripted, reproducible demo videos of web applications, written and run by an LLM agent"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["playwright>=1.49"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
demorec = "demorec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demorec = ["cursor.js"]
