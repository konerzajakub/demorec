name = "{{project}}"

[app]
url = "http://127.0.0.1:5173/"   # page the demo starts on
ready = ""                       # Playwright selector visible once the app is usable, e.g. "role=navigation"

[browser]
width = 1440
height = 900
locale = "en-US"                 # also the language of the browser UI and date formats
timezone = "UTC"
channel = ""                     # "chrome" = installed Google Chrome, empty = Playwright Chromium
safe_top = 80                    # px covered by fixed bars at the top, elements above it get scrolled into view
safe_bottom = 60
fixed_header = 0                 # px height of a fixed header, its elements are never scrolled to
scroll = true                    # click/hover first wheel-scroll the target into view. false for canvas apps,
                                 # where the wheel pans or zooms instead of scrolling

[recording]
fps = 30
crf = 20                         # x264 quality, lower = bigger and sharper
scale = 2                        # device pixels per CSS pixel, 2 = a 2880x1800 video from the 1440x900 browser
video_scale = 0                  # video pixels per CSS pixel, 0 = scale
max_zoom = 12                    # a.zoom() never zooms in further
crop_zoom = 1.5                  # zooms up to this crop the frames, larger ones the browser renders sharp
before = ""                      # shell command run in this folder before every record/check, e.g. "pwsh -File reset.ps1"

[motion]                         # easings: spring spring-soft snappy bouncy human ease-in-out cubic quint material smoothstep linear
zoom_easing = "spring"           # zoom, zoom_out and the camera's pans
zoom_duration = 1.0              # s
cursor_easing = "human"
cursor_speed = 1.0               # 2 = cursor moves take half as long
cursor_curve = 0.05              # the cursor path bows by this fraction of its length, 0 = straight
scroll_easing = "ease-in-out"    # wheel scrolls and a.center()
scroll_speed = 500               # average px/s of a scroll, the peak is about 1.7x

# Login form, filled before every run. Uncomment if the app needs a login. For other login
# flows define login(a) in helpers.py instead. Values here are the Keycloak defaults.
